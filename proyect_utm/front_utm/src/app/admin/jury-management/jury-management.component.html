<div class="jury-management">
  <p-confirmDialog></p-confirmDialog>
  <div class="flex justify-content-between align-items-center mb-4">
    <h3>Gestión de Jurados</h3>
    <button pButton icon="pi pi-plus" label="Registrar Jurado" (click)="showJuryDialog()"
      class="p-button-success"></button>
  </div>

  <p-table [value]="jurors" [paginator]="true" [rows]="10">
    <ng-template pTemplate="header">
      <tr>
        <th>Nombre</th>
        <th>Email</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-jury>
      <tr>
        <td>{{ jury.name }}</td>
        <td>{{ jury.email }}</td>
        <td>
          <span [class]="'status-badge ' + (jury.isActive ? 'status-active' : 'status-inactive')">
            {{ jury.isActive ? 'Activo' : 'Inactivo' }}
          </span>
        </td>
        <td>
          <div class="flex gap-2">
            <button pButton icon="pi pi-pencil" class="p-button-secondary p-button-sm"
              (click)="showJuryDialog(jury)"></button>
            <button pButton icon="pi pi-trash" class="p-button-danger p-button-sm" (click)="removeJury(jury.id)"
              pTooltip="Eliminar" tooltipPosition="top"></button>
            <button pButton icon="pi pi-refresh" class="p-button-warning p-button-sm" (click)="resetPassword(jury.id)"
              pTooltip="Resetear Contraseña" tooltipPosition="top"></button>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>

  <p-dialog header="Registrar Nuevo Jurado" [(visible)]="displayJuryDialog" [style]="{width: '95vw', maxWidth: '500px'}">
    <form [formGroup]="juryForm" (ngSubmit)="saveJury()">
      <div class="p-fluid">
        <div class="field">
          <label>Nombre Completo</label>
          <input type="text" pInputText formControlName="name" placeholder="Nombre del jurado">
        </div>

        <div class="field">
          <label>Email</label>
          <input type="email" pInputText formControlName="email" placeholder="email@utm.edu.ec">
        </div>

      </div>

      <div class="flex justify-content-end gap-2 mt-3">
        <button pButton type="button" label="Cancelar" (click)="displayJuryDialog = false"
          class="p-button-secondary"></button>
        <button pButton type="submit" label="Registrar" [disabled]="!juryForm.valid" class="p-button-success"></button>
      </div>
    </form>
  </p-dialog>
</div>
