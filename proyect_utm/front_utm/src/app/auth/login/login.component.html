<div class="login-container">
  <div class="login-card">
    <img src="assets/images/Logo_utm.png" alt="UTM" class="logo">
    <h3>Sistema de Evaluación de Eventos UTM</h3>

    <div class="role-selection">
      <button (click)="selectRole('student')" class="role-btn" [class.selected]="selectedRole === 'student'">
        <i class="pi pi-users"></i>
        Asistente
      </button>
      <button (click)="selectRole('jury')" class="role-btn" [class.selected]="selectedRole === 'jury'">
        <i class="pi pi-star"></i>
        Jurado
      </button>
      <button (click)="selectRole('manager')" class="role-btn manager-btn" [class.selected]="selectedRole === 'manager'">
        <i class="pi pi-briefcase"></i>
        Gestor de Evento
      </button>
      <button (click)="selectRole('admin')" class="role-btn admin-btn" [class.selected]="selectedRole === 'admin'">
        <i class="pi pi-lock"></i>
        Administrador
      </button>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" *ngIf="selectedRole" class="login-form">
      <div class="p-fluid">
        <div class="field">
          <label for="email">Correo Electrónico</label>
          <input id="email" type="email" pInputText formControlName="email" placeholder="usuario@utm.edu.ec">
          <small *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="p-error">
            Correo electrónico válido requerido
          </small>
        </div>

        <div class="field" *ngIf="selectedRole !== 'student'">
          <label for="password">Contraseña</label>
          <p-password id="password" formControlName="password" [feedback]="false" placeholder="Ingrese su contraseña"
            [toggleMask]="true">
          </p-password>
          <small *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="p-error">
            Contraseña requerida
          </small>
        </div>

        <button type="submit" pButton label="Ingresar" [disabled]="!loginForm.valid"
          class="w-full login-button"></button>
      </div>
    </form>
  </div>
</div>
