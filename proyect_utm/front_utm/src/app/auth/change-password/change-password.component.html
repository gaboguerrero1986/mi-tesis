<div class="flex justify-content-center align-items-center min-h-screen bg-blue-50">
    <p-card header="Cambiar Contraseña" class="w-full md:w-5 shadow-4" [style]="{width: '100%', maxWidth: '450px'}">
        <div class="mb-4 text-center">
            <i class="pi pi-lock text-4xl text-blue-500 mb-2"></i>
            <p class="text-600 m-0">Por seguridad, debes cambiar tu contraseña temporal.</p>
        </div>

        <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()">
            <div class="p-fluid">
                <div class="field mb-3">
                    <label for="oldPassword" class="block text-900 font-medium mb-2">Contraseña Actual
                        (Temporal)</label>
                    <input id="oldPassword" type="password" pInputText formControlName="oldPassword"
                        placeholder="Tu contraseña actual">
                </div>

                <div class="field mb-3">
                    <label for="newPassword" class="block text-900 font-medium mb-2">Nueva Contraseña</label>
                    <input id="newPassword" type="password" pInputText formControlName="newPassword"
                        placeholder="Mínimo 6 caracteres">
                </div>

                <div class="field mb-4">
                    <label for="confirmPassword" class="block text-900 font-medium mb-2">Confirmar Nueva
                        Contraseña</label>
                    <input id="confirmPassword" type="password" pInputText formControlName="confirmPassword"
                        placeholder="Repite la nueva contraseña">
                    <small *ngIf="passwordForm.hasError('mismatch') && passwordForm.get('confirmPassword')?.touched"
                        class="p-error block">
                        Las contraseñas no coinciden
                    </small>
                </div>

                <button pButton pRipple label="Actualizar Contraseña" icon="pi pi-save" class="w-full" type="submit"
                    [loading]="loading" [disabled]="passwordForm.invalid"></button>
            </div>
        </form>
    </p-card>
</div>
