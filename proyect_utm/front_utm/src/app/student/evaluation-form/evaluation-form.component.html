<div class="student-evaluation p-4 max-w-4xl mx-auto">
    <p-confirmDialog></p-confirmDialog>

    <div *ngIf="loading" class="flex justify-content-center p-5">
        <p-progressSpinner></p-progressSpinner>
    </div>

    <div *ngIf="!loading && event" class="surface-card p-4 shadow-2 border-round">
        <div class="flex align-items-center justify-content-between mb-4">
            <div>
                <h1 class="text-3xl font-bold text-900 mb-2">{{ event.titulo }}</h1>
                <div class="flex align-items-center gap-3 text-600">
                    <span><i class="pi pi-calendar mr-1"></i> {{ event.fecha_inicio | date:'mediumDate' }}</span>
                </div>
            </div>
            <button pButton icon="pi pi-arrow-left" label="Volver" class="p-button-outlined p-button-secondary"
                routerLink="/student"></button>
        </div>

        <form [formGroup]="evaluationForm" (ngSubmit)="onSubmit()">
            <h3 class="text-xl font-semibold text-800 mb-3 border-bottom-1 surface-border pb-2">
                Formulario de Evaluación
            </h3>

            <div formArrayName="details" class="flex flex-column gap-4 mb-5">
                <div *ngFor="let detail of details.controls; let i = index" [formGroupName]="i"
                    class="p-3 border-1 surface-border border-round hover:surface-50 transition-colors transition-duration-200">

                    <div class="flex flex-column gap-2">
                        <label class="font-medium text-900 text-lg">
                            {{ detail.get('metricName')?.value }}
                            <span class="text-red-500">*</span>
                        </label>

                        <!-- Quantitative Metric -->
                        <div *ngIf="detail.get('metricType')?.value === 'quantitative'" class="mt-2">
                            <div class="flex align-items-center gap-3">
                                <p-rating formControlName="value" [stars]="5" [cancel]="false" onIcon="pi pi-circle-fill text-2xl text-primary" offIcon="pi pi-circle text-2xl text-400"></p-rating>
                                <div class="ml-3 text-xl font-bold text-primary text-center">
                                    {{ detail.get('value')?.value || '-' }} / 5
                                </div>
                            </div>
                        </div>

                        <!-- Qualitative Metric -->
                        <div *ngIf="detail.get('metricType')?.value === 'qualitative'" class="mt-2">
                            <textarea pInputTextarea formControlName="textValue" rows="3"
                                placeholder="Escribe tu opinión aquí..." class="w-full"></textarea>
                        </div>

                        <small *ngIf="detail.invalid && (detail.touched || detail.dirty)" class="p-error block mt-1">
                            Este campo es requerido
                        </small>
                    </div>
                </div>
            </div>

            <div class="flex flex-column gap-2 mb-4">
                <label class="font-medium text-900 text-lg">Comentarios y Sugerencias (Opcional)</label>
                <textarea pInputTextarea formControlName="comments" rows="4"
                    placeholder="¿Qué te pareció el evento en general? Escribe tu testimonio aquí..."
                    class="w-full border-round"></textarea>
            </div>

            <div class="flex justify-content-end gap-3">
                <button pButton type="button" label="Cancelar" routerLink="/student"
                    class="p-button-secondary p-button-outlined"></button>
                <button pButton type="submit" label="Enviar Evaluación" icon="pi pi-send" [loading]="submitting"
                    class="p-button-primary px-5"></button>
            </div>
        </form>
    </div>
</div>
